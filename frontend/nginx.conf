# Frontend: uma versão por idioma (/pt-PT/, /en/) e a API na mesma origem (/api → api:8080).
map $http_accept_language $idioma {
  default pt-PT;
  ~^en en;
}

server {
  listen 80;
  absolute_redirect off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  location = / {
    return 302 /$idioma/;
  }

  location /api/ {
    proxy_pass http://api:8080;
    # Host com a porta: a API reconhece o pedido como da mesma origem (sem CORS)
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ficheiros com hash no nome: guardar em cache; index.html: nunca
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /pt-PT/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /pt-PT/index.html;
  }

  location /en/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /en/index.html;
  }
}
